openapi: 3.0.3
info:
  title: Ipet - Ordering
  version: 1.0.0
  description: OpenAPI specification for the Ordering microservice.

servers:
  - description: Development
    url: http://localhost:8080/api
  - description: Production
    url: https://ipet.com/api

tags:
  - name: Customers
    description: Operations related to customers and their addresses
  - name: Companies
    description: Operations related to companies
  - name: Pets
    description: Operations related to customer pets
  - name: Shopping Carts
    description: Operations related to shopping carts
  - name: Schedules
    description: Operations related to appointment schedules
  - name: Bookings
    description: Operations related to appointment bookings

paths:
  /v1/appointment-schedules:
    post:
      tags: [Schedules]
      summary: Create a new appointment schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        201:
          description: Created. Location header contains URL of the new resource.
          headers:
            Location:
              description: URL of the created appointment schedule
              example: /api/v1/appointment-schedules/09a46223-1757-454a-bd30-75b36f09e765
              schema:
                type: string
        400:
          $ref: '#/components/responses/BadRequest'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Schedules]
      summary: Get an appointment schedule by id
      responses:
        200:
          description: Appointment schedule found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentScheduleDetailOutput'
        404:
          $ref: '#/components/responses/NotFound'

  /v1/appointment-schedules/{companyId}/availability:
    parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Schedules]
      summary: Get appointment availability for a company
      responses:
        200:
          description: Available dates and time slots for the company's appointment schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleAvailabilityOutput'
        404:
          $ref: '#/components/responses/NotFound'

  /v1/appointment-schedules/{appointmentScheduleId}/name:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Schedules]
      summary: Change the name of an appointment schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        204:
          description: No Content
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}/locked-dates:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Schedules]
      summary: Change locked dates for an appointment schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: string
                format: date
      responses:
        204:
          description: No Content
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}/activate:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
          type: string
          format: uuid
    post:
      tags: [Schedules]
      summary: Activate an appointment schedule
      responses:
        204:
          description: No Content
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}/deactivate:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
          type: string
          format: uuid
    post:
      tags: [Schedules]
      summary: Inactivate an appointment schedule
      responses:
        204:
          description: No Content
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}/work-days:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Schedules]
      summary: Add a work day to an appointment schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDayInput'
      responses:
        201:
          description: Created. Location header contains URL of the new resource.
          headers:
            Location:
              description: URL of the created work day
              example: /api/v1/appointment-schedules/09a46223-1757-454a-bd30-75b36f09e765/work-days/09a4
              schema:
                type: string
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}/work-days/{workDayId}:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: workDayId
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Schedules]
      summary: Remove a work day from an appointment schedule
      responses:
        204:
          description: No Content
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        500:
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Schedules]
      summary: Update a work day on an appointment schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkDayInput'
      responses:
        204:
          description: No Content
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-schedules/{appointmentScheduleId}/work-days/{workDayId}/locked-times:
    parameters:
      - in: path
        name: appointmentScheduleId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
          type: string
          format: uuid
      - in: path
        name: workDayId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
          type: string
          format: uuid
    post:
      tags: [Schedules]
      summary: Add a locked time to a work day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockedTimeInput'
      responses:
        201:
          description: Locked time created
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Schedules]
      summary: Remove a locked time from a work day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockedTimeInput'
      responses:
        204:
          description: No Content
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Schedules]
      summary: Change an existing locked time on a work day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockedTimeUpdateInput'
      responses:
        204:
          description: No Content
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/appointment-bookings:
    post:
      tags: [Bookings]
      summary: Create an appointment booking
      description: Creates an appointment booking for a customer, schedule, pets, and services.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentBookingInput'
      responses:
        201:
          description: Booking created. Location header contains the booking URL.
          headers:
            Location:
              description: URL of the created appointment booking
              example: /api/v1/appointment-bookings/09a46223-1757-454a-bd30-75b36f09e765
              schema:
                type: string
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/customers:
    post:
      tags: [Customers]
      summary: Create a new customer
      description: Create a new customer description
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        201:
          description: Created. Location header contains URL of the new resource.
          headers:
            Location:
              description: URL of the created customer
              example: /api/v1/customers/09a46223-1757-454a-bd30-75b36f09e765
              schema:
                type: string
        400:
          $ref: '#/components/responses/BadRequest'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Customers]
      summary: Filter customers (paged)
      parameters:
        - in: query
          name: firstName
          schema:
            type: string
        - in: query
          name: lastName
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
            example: name@email.com
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
      responses:
        200:
          description: A paged list of customer summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomerSummaryOutput'

  /v1/customers/{customerId}:
    parameters:
      - in: path
        name: customerId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
          type: string
          format: uuid
    get:
      tags: [Customers]
      summary: Get a customer by id
      responses:
        200:
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailOutput'
        404:
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateInput'
      responses:
        204:
          description: Updated successfully
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ Customers ]
      summary: Delete a customer
      responses:
        204:
          description: Deleted successfully
        404:
          $ref: '#/components/responses/NotFound'

  /v1/customers/{customerId}/email:
    parameters:
      - in: path
        name: customerId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
          type: string
          format: uuid
    put:
      tags: [Customers]
      summary: Change customer email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        204:
          description: Email changed
        400:
          $ref: '#/components/responses/BadRequest'
        404:
          $ref: '#/components/responses/NotFound'
        409:
          $ref: '#/components/responses/Conflict'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'

  /v1/customers/{customerId}/addresses:
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [ Customers ]
      summary: Add an address to a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressData'
      responses:
        201:
          description: Address added. Location header may contain the address URL or resource id.
          headers:
            Location:
              description: URL of the created address
              schema:
                type: string
        400:
          $ref: '#/components/responses/BadRequest'
        422:
          $ref: '#/components/responses/UnprocessableContent'
        500:
          $ref: '#/components/responses/InternalError'
    get:
      tags: [ Customers ]
      summary: find All Addresses
      responses:
        200:
          description: A list of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerAddressOutput'

  /v1/customers/{customerId}/addresses/{addressId}:
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: addressId
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [ Customers ]
      summary: Update a customer address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressData'
      responses:
        204:
          description: Address updated
        400:
          description: Validation error
    delete:
      tags: [Customers]
      summary: Remove an address from a customer
      responses:
        204:
          description: Address removed
        404:
          description: Customer or address not found

  /v1/customers/{customerId}/addresses/{addressId}/principal:
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: addressId
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [ Customers ]
      summary: Change principal address for a customer
      responses:
        204:
          description: Principal address changed
        404:
          description: Customer or address not found

  /v1/companies:
    post:
      tags: [Companies]
      summary: Create a new company
      description: Create a new company with a single address
      requestBody:
        required: true
        content:
         application/json:
           schema:
             $ref: '#/components/schemas/CompanyInput'
      responses:
        201:
         description: Created. Location header contains URL of the new resource.
         headers:
           Location:
             description: URL of the created company
             schema:
               type: string
        400:
         $ref: '#/components/responses/BadRequest'
        409:
         $ref: '#/components/responses/Conflict'
        422:
         $ref: '#/components/responses/UnprocessableContent'
        500:
         $ref: '#/components/responses/InternalError'
    get:
      tags: [Companies]
      summary: Filter companies (paged)
      parameters:
        - in: query
          name: companyName
          schema:
            type: string
        - in: query
          name: email
          schema:
            type: string
            example: company@email.com
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
      responses:
        200:
         description: A paged list of company summaries
         content:
           application/json:
             schema:
               allOf:
                 - $ref: '#/components/schemas/Page'
                 - type: object
               properties:
                 content:
                   type: array
                   items:
                     $ref: '#/components/schemas/CompanySummaryOutput'

  /v1/companies/{companyId}:
    parameters:
      - in: path
        name: companyId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
         type: string
         format: uuid
    get:
      tags: [Companies]
      summary: Get a company by id
      responses:
        200:
         description: Company found
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/CompanyDetailOutput'
        404:
         $ref: '#/components/responses/NotFound'
    put:
      tags: [Companies]
      summary: Update a company
      requestBody:
        required: true
        content:
         application/json:
           schema:
             $ref: '#/components/schemas/CompanyUpdateInput'
      responses:
        204:
         description: Updated successfully
        400:
         $ref: '#/components/responses/BadRequest'
        404:
         $ref: '#/components/responses/NotFound'
        409:
         $ref: '#/components/responses/Conflict'
        422:
         $ref: '#/components/responses/UnprocessableContent'
        500:
         $ref: '#/components/responses/InternalError'
    delete:
      tags: [ Companies ]
      summary: Delete a company
      responses:
        204:
         description: Deleted successfully
        404:
         $ref: '#/components/responses/NotFound'

  /v1/companies/{companyId}/email:
    parameters:
      - in: path
        name: companyId
        required: true
        schema:
         type: string
         format: uuid
    patch:
      tags: [Companies]
      summary: Change company email
      requestBody:
        required: true
        content:
         application/json:
           schema:
             $ref: '#/components/schemas/EmailInput'
      responses:
        204:
         description: Email changed
        400:
         description: Validation error

  /v1/customers/{customerId}/pets:
    parameters:
      - in: path
        name: customerId
        required: true
        schema:
         type: string
         format: uuid
    post:
      tags: [Pets]
      summary: Create a new pet for a customer
      requestBody:
        required: true
        content:
         application/json:
           schema:
             $ref: '#/components/schemas/PetInput'
      responses:
        201:
         description: Created. Location header contains URL of the new resource.
         headers:
           Location:
             description: URL of the created pet
             schema:
               type: string
        400:
         $ref: '#/components/responses/BadRequest'
        422:
         $ref: '#/components/responses/UnprocessableContent'
        500:
         $ref: '#/components/responses/InternalError'
    get:
      tags: [Pets]
      summary: Filter customer pets (paged)
      parameters:
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: type
          schema:
            type: string
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
      responses:
        200:
         description: A paged list of pet summaries
         content:
           application/json:
             schema:
               allOf:
                 - $ref: '#/components/schemas/Page'
                 - type: object
               properties:
                 content:
                   type: array
                   items:
                     $ref: '#/components/schemas/PetSummaryOutput'

  /v1/customers/{customerId}/pets/{petId}:
    parameters:
      - in: path
        name: customerId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
         type: string
         format: uuid
      - in: path
        name: petId
        required: true
        example: 09a46223-1757-454a-bd30-75b36f09e765
        schema:
         type: string
         format: uuid
    get:
      tags: [Pets]
      summary: Get a pet by id
      responses:
        200:
         description: Pet found
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/PetDetailOutput'
        404:
         $ref: '#/components/responses/NotFound'
    put:
      tags: [Pets]
      summary: Update a pet
      requestBody:
        required: true
        content:
         application/json:
           schema:
             $ref: '#/components/schemas/PetUpdateInput'
      responses:
        204:
         description: Updated successfully
        400:
         $ref: '#/components/responses/BadRequest'
        404:
         $ref: '#/components/responses/NotFound'
        422:
         $ref: '#/components/responses/UnprocessableContent'
        500:
         $ref: '#/components/responses/InternalError'
    delete:
      tags: [Pets]
      summary: Remove a pet from a customer
      responses:
        204:
         description: Pet removed
        404:
         $ref: '#/components/responses/NotFound'

  /v1/customers/{customerId}/shopping-carts:
    parameters:
     - in: path
       name: customerId
       required: true
       schema:
         type: string
         format: uuid
    post:
     tags: [Shopping Carts]
     summary: Create a new shopping cart for a customer
     responses:
       201:
         description: Created. Location header contains URL of the new resource.
         headers:
           Location:
             description: URL of the created shopping cart
             schema:
               type: string
       400:
         $ref: '#/components/responses/BadRequest'
       422:
         $ref: '#/components/responses/UnprocessableContent'
       500:
         $ref: '#/components/responses/InternalError'

  /v1/customers/{customerId}/shopping-carts/{shoppingCartId}:
    parameters:
     - in: path
       name: customerId
       required: true
       schema:
         type: string
         format: uuid
     - in: path
       name: shoppingCartId
       required: true
       schema:
         type: string
         format: uuid
    put:
      tags: [ Shopping Carts ]
      summary: Empty the shopping cart
      responses:
        204:
          description: Shopping cart emptied
        404:
          description: Shopping cart not found
    delete:
     tags: [Shopping Carts]
     summary: Delete a shopping cart
     responses:
       204:
         description: Shopping cart deleted
       404:
         description: Shopping cart not found

  /v1/customers/{customerId}/shopping-carts/{shoppingCartId}/items:
    parameters:
     - in: path
       name: customerId
       required: true
       schema:
         type: string
         format: uuid
     - in: path
       name: shoppingCartId
       required: true
       schema:
         type: string
         format: uuid
    post:
     tags: [Shopping Carts]
     summary: Add an item to the shopping cart
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/ShoppingCartItemInput'
     responses:
       201:
         description: Item added
       400:
         $ref: '#/components/responses/BadRequest'
       404:
         $ref: '#/components/responses/NotFound'
       422:
         $ref: '#/components/responses/UnprocessableContent'
       500:
         $ref: '#/components/responses/InternalError'

  /v1/customers/{customerId}/shopping-carts/{shoppingCartId}/items/{itemId}:
    parameters:
     - in: path
       name: customerId
       required: true
       schema:
         type: string
         format: uuid
     - in: path
       name: shoppingCartId
       required: true
       schema:
         type: string
         format: uuid
     - in: path
       name: itemId
       required: true
       schema:
         type: string
         format: uuid
    delete:
     tags: [Shopping Carts]
     summary: Remove an item from the shopping cart
     responses:
       204:
         description: Item removed
       404:
         $ref: '#/components/responses/NotFound'

